# ZL Comp MPC skin layout, two tabs: COMP (the compressor itself) and OUT (side-chain high-pass,
# parallel mix, clipper, level, and the preset list).
# Layout grid as in mpc-vst-vfilter; black panel, white print, amber accent.
style=td3
theme_bg=111111
theme_panel=111111
theme_line=000000
theme_ink=f2f2f2
theme_ink_dim=a0a0a0
theme_ink_faint=555555
theme_accent=f0a020
theme_accent_hi=ffc860
theme_knob_face=262626
theme_knob_ring=000000
theme_knob_dot=f0a020
theme_bar=f0a020
theme_seg_active=f0a020
theme_seg_inactive=262626
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=000000
theme_knob_off=444444
theme_tab_on=f0a020
theme_tab_on_tx=111111
theme_lcd=140d02
theme_box=0a0a0a
theme_btn_bg=f2f2f2
theme_chrome_ink=f2f2f2
theme_go_on=f0a020
theme_go_off=ffc860
theme_tabs=f0a020

[tab COMP]
frame x=36 y=88 w=1207 h=624 title="ZL COMP"
knob cx=250 cy=260 r=34 label="THRESHOLD" key=thresh
knob cx=640 cy=260 r=34 label="RATIO" key=ratio
knob cx=1030 cy=260 r=34 label="KNEE" key=knee
knob cx=250 cy=550 r=34 label="ATTACK" key=attack
knob cx=640 cy=550 r=34 label="RELEASE" key=release
popup cx=1030 cy=540 w=220 h=48 label="STYLE" key=style
qlinks "COMP" = thresh,ratio,knee,attack,release,style

[tab OUT]
frame x=36 y=88 w=1207 h=624 title="SIDE-CHAIN / OUTPUT"
knob cx=250 cy=260 r=34 label="SC HP" key=schp
knob cx=640 cy=260 r=34 label="MIX" key=mix
knob cx=250 cy=550 r=34 label="OUTPUT" key=output
knob cx=640 cy=550 r=34 label="CLIP" key=clip
popup cx=1030 cy=200 w=260 h=48 label="PRESET" key=preset
qlinks "OUT" = schp,mix,clip,output,preset
